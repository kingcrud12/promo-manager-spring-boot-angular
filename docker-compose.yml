services:
  postgres:
    image: postgres:16
    container_name: promomanager-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-promomanager}
      POSTGRES_USER: ${POSTGRES_USER:-promomanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-promomanager}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-promomanager} -d ${POSTGRES_DB:-promomanager}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: promomanager-api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-promomanager}
      DB_USER: ${POSTGRES_USER:-promomanager}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-promomanager}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
